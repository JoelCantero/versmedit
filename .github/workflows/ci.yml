name: CI

# Authoritative pull-request gate: no PR is merge-ready unless every check passes.
# Runs on GitHub-hosted x64 runners (NOT the self-hosted Raspberry Pi) so it
# never competes with production for resources. Build/type errors are
# platform-independent, so x64 is fine as a pre-merge gate.
on:
  pull_request:
    branches:
      - main
  # Seed a trusted default-branch browser cache that future PRs can restore.
  push:
    branches:
      - main

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ci-build
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      AUTH_SECRET: ci-build-secret-not-used-in-runtime-000000
      NEXTAUTH_URL: http://localhost:3100
      RUN_INTEGRATION_TESTS: "true"

    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install pnpm first so setup-node can compute the pnpm store cache.
      # Version is read from the `packageManager` field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the runtime image (node:24-slim) used in docker/Dockerfile.
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/generated is gitignored, so the Prisma client must be generated
      # before the build (mirrors the builder stage in docker/Dockerfile).
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Migrate test database
        run: pnpm db:deploy

      - name: Validate SpecKit compliance
        run: bash .specify/scripts/bash/compliance-check.sh --all

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      # Hosted runners are ephemeral, so native libraries must still be
      # installed even when the browser binaries are restored from cache.
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
        timeout-minutes: 10

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        timeout-minutes: 10

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Build and end-to-end smoke test
        run: pnpm test:e2e

      - name: Validate production Docker images
        run: |
          docker build --target runner --tag "${PROJECT_NAME}-ci:latest" --file docker/Dockerfile .
          docker build --target migrator --tag "${PROJECT_NAME}-migrate-ci:latest" --file docker/Dockerfile .

  warm-playwright-cache:
    name: Warm Playwright cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        timeout-minutes: 10

      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
